# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Generates changelog from conventional commits

[changelog]
# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.github.pr_number }})){% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Remove leading/trailing whitespace
trim = true

# Changelog header
header = """
# Changelog

All notable changes to the ARS Apps platform will be documented in this file.

This changelog is automatically generated from commit messages using [git-cliff](https://git-cliff.org/).

"""

# Changelog footer
footer = """
---
*Generated by [git-cliff](https://git-cliff.org/)*
"""

[git]
# Parse conventional commits
conventional_commits = true

# Filter out unconventional commits
filter_unconventional = true

# Process commits in topological order
topo_order = true

# Sort commits by date (newest first in each group)
sort_commits = "newest"

# Regex for parsing commits
commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^docs", group = "📚 Documentation" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔨 Refactoring" },
    { message = "^style", group = "🎨 Styling" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "📦 Dependencies" },
    { message = "^chore", group = "🧹 Miscellaneous" },
    { message = "^ci", group = "⚙️ CI/CD" },
    { message = "^build", group = "🏗️ Build" },
    { message = "^security", group = "🔒 Security" },
    { message = "^revert", group = "⏪ Reverts" },
    # Accessibility
    { message = ".*a11y.*", group = "♿ Accessibility" },
    { message = ".*accessibility.*", group = "♿ Accessibility" },
    { message = ".*wcag.*", group = "♿ Accessibility" },
    { message = ".*508.*", group = "♿ Accessibility" },
    # USWDS
    { message = ".*uswds.*", group = "🎨 USWDS" },
]

# Protect breaking changes
protect_breaking_commits = false

# Filter out certain commits
filter_commits = false

# Tag pattern for releases
tag_pattern = "v[0-9].*"

# Skip tags matching pattern
# skip_tags = ""

# Ignore tags matching pattern
# ignore_tags = ""

# Link parsers (for PR/issue references)
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/issues/$1" },
    { pattern = "PR #(\\d+)", href = "https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/$1" },
]

[remote.github]
owner = "USDA-REE-ARS"
repo = "ars-apps"
