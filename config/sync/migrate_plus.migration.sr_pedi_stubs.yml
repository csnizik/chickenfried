    value: ''
  field_s_id10: id10
  field_s_etag:
    -
      plugin: skip_on_empty
      method: process
      source: etag
    -
      plugin: callback
      callable: trim
    -
      plugin: skip_on_value
      method: process
      value: '0000'
  field_s_breed:
    -
      plugin: skip_on_empty
      method: process
      source: breed
    -
      plugin: callback
      callable: trim
    -
      plugin: skip_on_value
      method: process
      value: '00'
    -
      plugin: entity_generate
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_breeds
      value_key: name
      ignore_case: true
destination:
  plugin: 'entity:sheep_entities_sheep_record'
