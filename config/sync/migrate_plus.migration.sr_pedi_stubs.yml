id: sr_pedi_stubs
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - pedi
  - sheep_record
  - stubs
  - idempotent
migration_group: sheep_data
label: 'PEDI Registry → Create stub sheep_records for all animals'
source:
  plugin: csv
  path: modules/custom/sheep_migration/data/pedigree-csv/registry/pedi_registry.csv
  ids:
    - id10
process:
  _existing_entity:
    plugin: entity_lookup
    source: id10
    entity_type: sheep_entities_sheep_record
    value_key: field_s_id10
    ignore_case: true
  _existing_check:
    -
      plugin: get
      source: '@_existing_entity'
    -
      plugin: callback
      callable: strval
  _skip_if_exists:
    plugin: skip_on_value
    method: row
    source: '@_existing_check'
