          alter:
            alter_text: true
            text: "<article class=\"usa-prose site-prose margin-top-0 margin-bottom-4\">\r\n  <h2 class=\"margin-top-2 margin-bottom-2\">\r\n    <a class=\"usa-link\" href=\"{{ view_nematode_entities_specimen }}\" rel=\"bookmark\">\r\n      Entry Number: {{ field_n_entry_number }}\r\n    </a>\r\n  </h2>\r\n<ul class=\"usa-list usa-list--unstyled\">\r\n  {# Nematode #}\r\n  {% if field_n_nematode_genus or field_n_nematode_species %}\r\n    <li>\r\n      <span class=\"text-bold\">Nematode:</span>\r\n      <span class=\"text-italic\">{{ field_n_nematode_genus }} {{ field_n_nematode_species }}</span>\r\n    </li>\r\n  {% endif %}\r\n\r\n  {# Host (emphasize genus/species; optional common name in parens; optional “in/on …”) #}\r\n  {% if field_n_host_genus or field_n_host_species or field_n_common_name or field_n_nematodes_in %}\r\n    <li>\r\n      <span class=\"text-bold\">Host:</span>\r\n      <span class=\"text-italic\">\r\n        {{- [field_n_host_genus, field_n_host_species]|filter(v => v is not empty)|join(' ') -}}\r\n      </span>\r\n      {%- set _common = field_n_common_name|trim|striptags|replace({'&amp;': '& '}) -%}\r\n      {%- if _common is not empty %} ({{ _common }}){% endif -%}\r\n      {%- if field_n_nematodes_in is not empty %} in/on {{ field_n_nematodes_in }}{% endif -%}\r\n    </li>\r\n  {% endif %}\r\n\r\n  {# Origin: locale, state, country — no stray commas, any combination #}\r\n  {% if field_n_origin_country or field_n_origin_state or field_n_origin_locale %}\r\n    <li>\r\n      <span class=\"text-bold\">Origin: </span>\r\n      {%- set parts = [] -%}\r\n      {%- if field_n_origin_locale is not empty %}{% set parts = parts|merge([field_n_origin_locale]) %}{% endif -%}\r\n      {%- if field_n_origin_state  is not empty %}{% set parts = parts|merge([field_n_origin_state])  %}{% endif -%}\r\n      {%- if field_n_origin_country is not empty %}{% set parts = parts|merge([field_n_origin_country]) %}{% endif -%}\r\n      {{ parts|join(', ') }}\r\n    </li>\r\n  {% endif %}\r\n\r\n  {% if field_n_collector is not empty %}\r\n    <li><span class=\"text-bold\">Collector:</span> {{ field_n_collector }}</li>\r\n  {% endif %}\r\n\r\n  {% if field_n_date_collected is not empty %}\r\n    <li><span class=\"text-bold\">Date Collected:</span> {{ field_n_date_collected }}</li>\r\n  {% endif %}\r\n\r\n  {% if field_n_date_received is not empty %}\r\n    <li><span class=\"text-bold\">Date Received:</span> {{ field_n_date_received }}</li>\r\n  {% endif %}\r\n\r\n  {% if field_n_disposition is not empty %}\r\n    <li><span class=\"text-bold\">Disposition of Sample:</span> {{ field_n_disposition }}</li>\r\n  {% endif %}\r\n\r\n  {% if field_n_slides_value is not empty %}\r\n    <li>\r\n      <span class=\"text-bold\">Slides:</span>\r\n      {{ field_n_slides_value|striptags|trim|replace({'&amp;': '& '})|split('\\n')|filter(v => v != '')|join(', ') }}\r\n    </li>\r\n  {% endif %}\r\n\r\n  {% if field_n_vials_value is not empty %}\r\n    <li>\r\n      <span class=\"text-bold\">Vials:</span>\r\n      {{ field_n_vials_value|striptags|trim|replace({'&amp;': '& '})|split('\\n')|filter(v => v != '')|join(', ') }}\r\n    </li>\r\n  {% endif %}\r\n</ul>\r\n</article>"
