  imperfect:
    '#type': webform_wizard_page
    '#title': 'Imperfect SSR Minimums'
    imperfect_contextual_help:
      '#type': processed_text
      '#text': |
        <h4 class=class="text-uppercase" id="webform-help-imperfect">Quick Reference</h4>
        <ul class="usa-list">
          <li><span class="text-bold">Rpt:</span> Minimum repeats for an SSR to be relevant</li>
          <li><span class="text-bold">NRR:</span> Maximum gap (base pairs) to adjacent SSR for joining</li>
          <li>If gap ≤ NRR, the SSR "wants" to join its neighbor</li>
          <li>Use multiple Rpt/NRR pairs for tiered thresholds (e.g., 4,6 then 3,2)</li>
          <li>Leave all fields empty to search for perfect SSRs only</li>
        </ul>
      '#format': html_no_filter
    intro_step3:
      '#type': webform_markup
      '#format': value
      '#markup': '<div class="usa-prose"><p>The minimum number of times a microsatellite must repeat before being reported, taking into account an adjacent microsatellite separated by a NRR. Leave unused pairs blank.</p><ul><li>It’s the minimum number of repeats to trigger reporting, not the minimum repeats to report.</li><li>It doesn’t matter that the repeat is next to an NRR (nearly all repeats in all sequences are next to NRR), what matters is ANOTHER repeat, adjacent to but separated from the original by an NRR.</li></ul><p>Example (trinucleotides): (4,6 ; 3,2 ; blank,blank) means ≥4 repeats when NRR ≤6, or ≥3 repeats when NRR ≤2.</p></div>'
