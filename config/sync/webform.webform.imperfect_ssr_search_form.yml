  sequences:
    '#type': webform_wizard_page
    '#title': Sequences
    processed_text:
      '#type': processed_text
      '#text': |-
        <div class="usa-alert usa-alert--warning usa-alert--slim">
          <div class="usa-alert__body">
            <p class="usa-alert__text"><strong>For sequences with > 1 million characters, use the file upload option.</strong></p>
          </div>
        </div>
      '#format': html_no_filter
    sequences_contextual_help:
      '#type': processed_text
      '#text': |
        <h4 class="text-uppercase" id="webform-help-sequences">Quick Reference</h4>
        <ul class="usa-list">
          <li>
            You may either:
            <ol class="usa-list">
              <li>Paste FASTA-formatted nucleotide sequence(s) (up to 1 million characters), or</li>
              <li>Upload a FASTA-formatted file (see upload requirements below)</li>
            </ol>
          </li>
          <li>Case and line length do not matter</li>
          <li>Comments (semicolon to end of line) are stripped</li>
          <li>
            For help with formatting, see
            <a
              href="https://blast.ncbi.nlm.nih.gov/doc/blast-topics/"
              target="_blank"
              rel="noopener"
              >FASTA format reference</a
            >
          </li>
        </ul>
        <hr />
        <h4 class="text-uppercase">Upload requirements</h4>
        <ul class="usa-list">
          <li>Maximum file size: <span class="usa-bold">100 MB</span></li>
          <li>Limit: one file per form</li>
          <li>
            Allowed file extensions:
            <ul class="usa-list">
            <li><code>.fasta</code></li>
            <li><code>.fa</code></li>
            <li><code>.fna</code></li>
            <li><code>.faa</code></li>
            <li><code>.txt</code></li>
            </ul>
          </li>
        </ul>
      '#format': html_no_filter
    paste_or_upload:
      '#type': radios
      '#title': 'How would you like to provide your sequence?'
      '#options':
        paste: 'Paste text'
        upload: 'Upload a file'
      '#required': true
    fasta_content:
      '#type': textarea
      '#title': 'Paste FASTA Content'
      '#rows': 10
      '#placeholder': |-
        >seq1
        ACGTACGTACGTATATATATCGCGCG
        >seq2
        GCGCGCGCGCGTATATATATACGTAC
      '#required': true
      '#counter_type': character
      '#counter_minimum': 1
      '#counter_maximum': 1000000
      '#counter_maximum_message': 'For sequences larger than 1 million characters, please select "Upload a file" instead.'
      '#states':
        visible-slide:
          ':input[name="paste_or_upload"]':
            value: paste
        enabled:
          ':input[name="paste_or_upload"]':
            value: paste
      '#states_clear': false
    upload_a_file:
      '#type': managed_file
      '#title': 'Upload a file'
      '#states':
        visible-slide:
          ':input[name="paste_or_upload"]':
            value: upload
        required:
          ':input[name="paste_or_upload"]':
            value: upload
      '#states_clear': false
      '#max_filesize': '100'
      '#file_extensions': 'fasta,fa,fna,faa,txt'
      '#sanitize': true
    resp_download_csv:
      '#type': hidden
      '#title': resp_download_csv
      '#default_value': '[webform:handler:post_operations:completed:download_urls:csv]'
    resp_download_all_txt:
