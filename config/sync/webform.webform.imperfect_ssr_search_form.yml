id: imperfect_ssr_search_form
title: 'Imperfect SSR Search Form'
description: ''
categories: {  }
elements: |-
  general:
    '#type': webform_wizard_page
    '#title': 'General Options'
    '#format': header
    general_contextual_help:
      '#type': processed_text
      '#text': |-
        <h4 class=class="text-uppercase" id="webform-help-general">Quick Reference</h4>
        <ul class="usa-list">
          <li><strong>A red asterisk<span class="text-error"> *</span></strong> indicates a required field.
          </li><li><strong>Default values:</strong> Fields are pre-filled; adjust as needed or leave defaults.
          </li><li><strong>Output linewrap width:</strong> Set columns for output wrapping (70–80 typical, 0 for no wrap)</li>
          <li><strong>Output case:</strong> Choose UPPER or lower for output sequences</li>
          <li><strong>Invert SSR case:</strong> Highlight found SSRs by inverting case (e.g., <code>ataaaTGTGTGTGcgatg</code>)</li>
          <li><strong>Ignore initial/trailing pairs:</strong> Skip unreliable base pairs at sequence ends</li>
          <li><strong>Aggressive join:</strong> Join SSRs when only one side "wants" to connect</li>
        </ul>
      '#format': html_no_filter
    outputwidth:
      '#type': number
      '#title': 'Output linewrap width'
      '#description': '<p>(0 = no wrap)</p>'
      '#title_display': before
      '#description_display': after
      '#help_display': title_after
      '#required': true
      '#default_value': '70'
      '#min': 0
      '#max': 999
    outputcase:
      '#type': select
      '#title': 'Output UPPERCASE/lowercase'
      '#options':
        L: lower
        U: UPPER
      '#default_value': L
      '#required': true
    invertmicrosatellites:
      '#type': select
      '#title': 'Invert SSR case'
      '#description': 'Example: ataaaTGTGTGTGcgatg'
      '#options':
        1: 'yes'
        0: 'no'
      '#default_value': 1
      '#required': true
    descriptionprocessing:
      '#type': select
      '#title': 'Description processing'
      '#options':
        none: 'Leave it alone'
        lop20: 'Remove fields > 20 chars'
      '#default_value': none
      '#required': true
    ignoreinitialcount:
      '#type': number
      '#title': 'Ignore initial pair count'
      '#description': 'Number of initial base pairs in each sequence to ignore.'
      '#default_value': 50
      '#min': 0
      '#max': 100000
      '#required': true
    ignoretrailingcount:
      '#type': number
      '#title': 'Ignore trailing pair count'
      '#description': 'Number of trailing base pairs in each sequence to ignore.'
      '#default_value': 30
      '#min': 0
      '#max': 100000
      '#required': true
    aggressivejoin:
      '#type': select
      '#title': 'Aggressive join'
      '#description': 'Yes: join NRR-separated SSRs if only one "wants" to join. No: join only if both "want" to join.'
      '#options':
        1: 'yes'
        0: 'no'
      '#default_value': 1
      '#required': true
  perfect:
    '#type': webform_wizard_page
    '#title': 'Perfect SSR Minimums'
    perfect_contextual_help:
      '#type': processed_text
      '#text': |
        <h4 class=class="text-uppercase" id="webform-help-perfect">Quick Reference</h4>
        <ul class="usa-list">
          <li>Set the <span class="text-bold">minimum repeat count</span> for each motif length (di-, tri-, tetra-, etc.)</li>
          <li>SSRs below the threshold are ignored. <span class="text-bold">Example:</span> Set trinucleotide to 5 reports <code>ATGATGATGATGATG</code> but ignores <code>ATGATGATGATG</code></li>
          <li>Leave all fields empty to search for imperfect SSRs only</li>
        </ul>
      '#format': html_no_filter
    intro_step2:
      '#type': webform_markup
      '#markup': '<div class="usa-prose"><p>The minimum number of times a microsatellite must repeat before being reported. A blank means that type will not be reported.</p></div>'
    p2:
      '#type': number
      '#title': '2 (dinucleotide)'
      '#default_value': '7'
      '#min': 0
      '#max': 99
