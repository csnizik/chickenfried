langcode: en
status: true
dependencies: {  }
id: sr_pedi_lineage_2010
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - '2010'
  - pedi
  - sheep_record
  - lineage
  - idempotent
migration_group: sheep_data
label: 'PEDI → Update sheep_records with lineage (2010)'
source:
  plugin: csv
  path: modules/custom/sheep_migration/data/pedi/preprocessed/PEDI2010.preprocessed.csv
  ids:
    - LAMBID
process:
  # Lookup existing sheep_record by LAMBID to get entity ID for update
  id:
    -
      plugin: callback
      callable: trim
      source: LAMBID
    -
      plugin: entity_lookup
      entity_type: sheep_entities_sheep_record
      value_key: field_s_id10
    -
      plugin: skip_on_empty
      method: row
      message: 'Lamb record not found for LAMBID'

  # Lookup sire sheep_record by SIREID
  field_s_sire:
    -
      plugin: skip_on_empty
      method: process
      source: SIREID
    -
      plugin: callback
      callable: trim
    -
      plugin: entity_lookup
      entity_type: sheep_entities_sheep_record
      value_key: field_s_id10

  # Lookup dam sheep_record by DAMID
  field_s_dam:
    -
      plugin: skip_on_empty
      method: process
      source: DAMID
    -
      plugin: callback
      callable: trim
    -
      plugin: entity_lookup
      entity_type: sheep_entities_sheep_record
      value_key: field_s_id10

destination:
  plugin: 'entity:sheep_entities_sheep_record'
  overwrite_properties:
    - field_s_sire
    - field_s_dam
migration_dependencies:
  required:
    - sr_pedi_stubs
