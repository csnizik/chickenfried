langcode: en
status: true
dependencies: {  }
id: sr_inv_update_2019
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - '2019'
  - inv
  - sheep_record
  - update
migration_group: sheep_data
label: 'INV 2019 → Update sheep_record fields'
source:
  plugin: csv
  path: modules/custom/sheep_migration/data/inv/INV2019.preprocessed.csv
  ids:
    - UID
  constants:
    record_year: '2019'
process:
  id:
    -
      plugin: callback
      callable: trim
      source: ID10
    -
      plugin: entity_lookup
      entity_type: sheep_entities_sheep_record
      value_key: field_s_id10
    -
      plugin: skip_on_empty
      method: row
      message: 'Sheep record not found for ID10'
  field_s_etag:
    -
      plugin: callback
      callable: trim
      source: ETAG
    -
      plugin: skip_on_empty
      method: process
  field_s_sex:
    -
      plugin: callback
      callable: trim
      source: SEX
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_sex
      value_key: name
  field_s_line:
    -
      plugin: callback
      callable: trim
      source: LINE
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_lines
      value_key: name
  field_s_subtype_mating:
    -
      plugin: callback
      callable: trim
      source: STM
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_subtype_matings
      value_key: name
  field_s_preliminary_disp:
    -
      plugin: callback
      callable: trim
      source: PD
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_preliminary_disposals
      value_key: name
  field_s_disposal:
    -
      plugin: callback
      callable: trim
      source: DISP
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_disposal_codes
      value_key: name
  field_s_disposal_date:
    -
      plugin: skip_on_empty
      method: process
      source: DAYDIS
    -
      plugin: callback
      callable: trim
    -
      plugin: skip_on_value
      method: process
      value:
        - '0'
        - ''
    -
      plugin: convert_date
      year: constants/record_year
  field_s_dna:
    -
      plugin: callback
      callable: trim
      source: DNA
    -
      plugin: skip_on_empty
      method: process
  field_s_scrapie_tag:
    -
      plugin: callback
      callable: trim
      source: IDZ65
    -
      plugin: skip_on_empty
      method: process
  field_s_color:
    -
      plugin: callback
      callable: trim
      source: CLR
    -
      plugin: skip_on_empty
      method: process
  field_s_altid:
    -
      plugin: callback
      callable: trim
      source: ALTID
    -
      plugin: skip_on_empty
      method: process
  field_s_inbreeding:
    -
      plugin: callback
      callable: trim
      source: INBRL
    -
      plugin: skip_on_empty
      method: process
destination:
  plugin: 'entity:sheep_entities_sheep_record'
  overwrite_properties:
    - field_s_etag
    - field_s_sex
    - field_s_line
    - field_s_subtype_mating
    - field_s_preliminary_disp
    - field_s_disposal
    - field_s_disposal_date
    - field_s_dna
    - field_s_scrapie_tag
    - field_s_color
    - field_s_altid
    - field_s_inbreeding
idMap: {  }
migration_dependencies:
  required:
    - sr_inv_stubs
include: null
