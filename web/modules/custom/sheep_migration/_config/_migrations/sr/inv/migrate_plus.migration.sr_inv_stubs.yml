langcode: en
status: true
dependencies: {  }
id: sr_inv_stubs
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - inv
  - sheep_record
  - stubs
  - idempotent
migration_group: sheep_data
label: 'INV → Create stub sheep_records for IDs not yet in database'
source:
  plugin: inventory_stubs
  paths:
    - modules/custom/sheep_migration/data/inv/INV2010.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2011.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2012.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2013.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2014.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2015.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2016.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2017.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2018.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2019.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2020.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2021.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2022.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2023.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2024.preprocessed.csv
    - modules/custom/sheep_migration/data/inv/INV2025.preprocessed.csv
  id_column: ID10
  constants:
    stub_month_day: 01-01
process:
  field_s_id10: id10
  field_s_breed:
    -
      plugin: skip_on_empty
      method: process
      source: breed_code
    -
      plugin: entity_lookup
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: s_breeds
      value_key: name
  field_s_birth_date:
    -
      plugin: concat
      source:
        - year
        - constants/stub_month_day
      delimiter: '-'
destination:
  plugin: 'entity:sheep_entities_sheep_record'
idMap: {  }
migration_dependencies:
  required: {  }
  optional: {  }
include: null
