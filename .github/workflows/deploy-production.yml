# Production Deployment Pipeline
# Builds and pushes Docker image to ACR with production tag
# ACR webhook triggers Azure App Service to pull the new image
#
# Trigger: Push to main branch (typically via PR merge from develop)
# Tag format: prod_arsapps_X.X.X-YYYY-MM-DD
#
# Release notes are automatically generated from:
# 1. Release Drafter draft (if available) - categorized by PR labels
# 2. GitHub's auto-generated notes (fallback) - from merged PRs

name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: acrasegrinprod01.azurecr.us
  IMAGE_NAME: ars-apps-drupal-rep

permissions:
  contents: write
  pull-requests: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # VERSION CALCULATION
  # ═══════════════════════════════════════════════════════════════════════════

  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version.outputs.current }}
      new_version: ${{ steps.version.outputs.new }}
      image_tag: ${{ steps.version.outputs.tag }}
      bump_type: ${{ steps.version.outputs.bump }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          # Get current version from VERSION file
          if [[ -f VERSION ]]; then
            CURRENT=$(cat VERSION | tr -d '[:space:]')
          else
            CURRENT="0.0.0"
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          # Get previous tag for release notes
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Determine bump type (manual input or default to patch)
          BUMP="${{ github.event.inputs.version_bump }}"
          if [[ -z "$BUMP" ]]; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT

          # Calculate new version
          case "$BUMP" in
            major)
              NEW="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "new=$NEW" >> $GITHUB_OUTPUT

          # Build image tag in required format: prod_arsapps_X.X.X-YYYY-MM-DD
          DATE=$(date -u +"%Y-%m-%d")
          TAG="prod_arsapps_${NEW}-${DATE}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Summary
          echo "## 📦 Version Calculation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Current Version | \`$CURRENT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | \`$BUMP\` |" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | \`$NEW\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Tag | \`$PREVIOUS_TAG\` |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # PRE-FLIGHT CHECKS
  # ═══════════════════════════════════════════════════════════════════════════

  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for debug code
        run: |
          echo "## 🔍 Pre-flight Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          DEBUG_PATTERNS='dpm\(|dvm\(|kint\(|dd\(|dump\(|var_dump\(|print_r\(|dsm\('

          if grep -rE "$DEBUG_PATTERNS" web/modules/custom/ web/themes/custom/ \
             --include="*.php" --include="*.module" --include="*.theme" --include="*.inc" 2>/dev/null; then
            echo "::error::Debug code found in codebase"
            echo "❌ **Debug code detected** - Remove before deploying" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No debug code found" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD AND PUSH
  # ═══════════════════════════════════════════════════════════════════════════

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [determine-version, pre-flight]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.determine-version.outputs.new_version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ needs.determine-version.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image pushed to ACR:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-version.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ACR webhook will trigger Azure App Service deployment." >> $GITHUB_STEP_SUMMARY

