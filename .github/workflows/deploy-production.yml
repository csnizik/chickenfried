  # ═══════════════════════════════════════════════════════════════════════════
  # HEALTH CHECK
  # ═══════════════════════════════════════════════════════════════════════════

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [determine-version, build-and-push]

    steps:
      - name: Wait for webhook deployment
        run: |
          echo "Waiting for ACR webhook to trigger deployment..."
          echo "This typically takes 2-3 minutes for:"
          echo "  - Webhook notification"
          echo "  - Image pull"
          echo "  - Container restart"
          echo "  - Drupal bootstrap (drush deploy)"
          sleep 150  # 2.5 minutes

      - name: Verify application health
        id: health
        run: |
          URL="${{ vars.PRODUCTION_URL }}"

          if [[ -z "$URL" ]]; then
            echo "::warning::PRODUCTION_URL variable not set, skipping health check"
            echo "⚠️ Health check skipped - PRODUCTION_URL not configured" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          HEALTH_URL="${URL}/user/login"

          echo "## 🏥 Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checking: \`${HEALTH_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --max-time 30 -L || echo "000")

            if [[ "$HTTP_CODE" =~ ^(200|302)$ ]]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
              echo "status=healthy" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Attempt $i/10: HTTP $HTTP_CODE - waiting 15s..."
            sleep 15
          done

          echo "❌ Health check failed after 10 attempts" >> $GITHUB_STEP_SUMMARY
          echo "status=unhealthy" >> $GITHUB_OUTPUT
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOYMENT SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    # needs: [determine-version, build-and-push, create-release, health-check]
    needs: [determine-version, build-and-push, health-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          VERSION="${{ needs.determine-version.outputs.new_version }}"
          TAG="${{ needs.determine-version.outputs.image_tag }}"

          echo "# 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.health-check.result }}" == "success" ]]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Deployment Completed with Warnings" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-and-push.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY

